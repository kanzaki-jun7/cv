<VirtualHost *:80>
    ServerName jdanu.suratkita.id
    DocumentRoot /var/www/jdanu.suratkita.id/dist

    <Directory /var/www/jdanu.suratkita.id/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/jdanu.suratkita.id-error.log
    CustomLog ${APACHE_LOG_DIR}/jdanu.suratkita.id-access.log combined
</VirtualHost>
